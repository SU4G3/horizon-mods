Initial release.

- Hold V to zoom in 3x; release to snap back to normal view.
- Scroll while holding V to zoom from 1x to 10x (x1.1 per wheel step); the hotbar doesn't move while zooming.
- Instant zoom with no transition, in the style of WI Zoom.
- Mouse turning slows down in step with the zoom for steady aiming.
- Key rebindable on the mod's page in Options > Mods.
- Permissions: render (camera zoom) and input (the zoom key and mouse wheel) only."""
